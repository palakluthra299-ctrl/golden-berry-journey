<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmation | WellWith Sea Buckthorn</title>
  <meta name="description" content="WellWith order confirmation — check your payment status.">
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link rel="stylesheet" href="assets/css/styles.css">
  <style>
    h1, h2, h3 { font-style: normal; }
    /* Confirmation header: no logo/wordmark — search only, single column */
    .co-topbar { grid-template-columns: 1fr; }
    .oc-wrap { max-width: 640px; margin: 0 auto; }
    .oc-card { background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius);
      padding: 26px 22px; margin: 18px 0; text-align: center;
      box-shadow: 0 10px 30px -18px rgba(140,105,25,.35); }
    .oc-icon { font-size: 54px; margin-bottom: 8px; }
    .oc-card h2 { font-family: var(--display); font-size: 24px; margin-bottom: 6px; }
    .oc-detail { text-align: left; background: #fbf7ec; border-radius: 12px; padding: 14px 16px;
      margin: 14px 0; font-size: 14px; }
    .oc-detail .row { display: flex; justify-content: space-between; padding: 6px 0;
      border-bottom: 1px dashed var(--card-border); }
    .oc-detail .row:last-child { border-bottom: 0; }
    .oc-cod { background: #eef7f1; border: 1px solid #bfe0cd; color: #1c5c3c; border-radius: 12px;
      padding: 12px 14px; font-size: 14px; margin: 12px 0; font-weight: 600; }
    .oc-pending { background: #fff8e6; border: 1px solid #ecd28a; color: #7a5200; border-radius: 12px;
      padding: 12px 14px; font-size: 14px; margin: 12px 0; }
    .oc-error { background: #fdecea; color: #8f1d12; border: 1px solid #f3b7ac; border-radius: 12px;
      padding: 12px 14px; font-size: 14px; margin: 12px 0; }
    .btn-block { display: block; width: 100%; text-align: center; margin-top: 10px; }
    .btn-outline { background: #fff; border: 1px solid var(--card-border); color: var(--text); }
    .btn { display: inline-block; padding: 13px 22px; border-radius: 999px; font-weight: 700; font-size: 15px; border: 0; }
    .oc-spinner { font-size: 40px; animation: ocspin 1.2s linear infinite; display: inline-block; }
    @keyframes ocspin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header class="storefront-header">
  <div class="container storefront-header-inner">
    <div class="storefront-topbar co-topbar">
      <form class="quick-search storefront-search" id="quick-search" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
        <input id="quick-search-input" type="search" placeholder="Search WellWith" aria-label="Search WellWith products">
        <button type="submit">Search</button>
      </form>
    </div>
  </div>
</header>

<div class="container page-head">
  <div class="oc-wrap" id="oc-root">
    <div class="oc-card">
      <div class="oc-spinner">🌀</div>
      <h2 class="display">Confirming your payment…</h2>
      <p style="color:var(--muted);font-size:14px">Please wait while we verify with the bank.</p>
    </div>
  </div>
</div>

<a class="wa-float" id="wa-float" target="_blank" rel="noopener" aria-label="Chat on WhatsApp" href="https://wa.me/919266086554?text=Namaste%20Palak!%20I%20want%20to%20know%20more%20about%20WellWith%20Sea%20Buckthorn%20products.">💬</a>

<script src="js/data.js"></script>
<script src="js/app.js?v=20260928-3"></script>
<script>
(function () {
  "use strict";
  var root = document.getElementById("oc-root");
  var WA_NUMBER = (typeof WA_PHONE !== "undefined") ? WA_PHONE : "919266086554";

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function money(n) {
    return "₹" + Number(n).toLocaleString("en-IN", { maximumFractionDigits: 2 });
  }

  var orderId = "";
  try { orderId = new URLSearchParams(window.location.search).get("order_id") || ""; } catch (e) {}

  var snapshot = null;
  try { snapshot = JSON.parse(sessionStorage.getItem("ww_order_" + orderId) || "null"); } catch (e) {}

  function waConfirmLink(status, paid) {
    var lines = snapshot && snapshot.lines
      ? snapshot.lines.map(function (l, i) { return (i + 1) + ". " + l.name + " × " + l.qty; }).join("\n")
      : "";
    var msg = "Hi WellWith! 👋\n\nMy order " + orderId + " (" + status + ")." +
      (lines ? "\n\nItems:\n" + lines : "") +
      "\n\nAmount paid online: " + money(paid) +
      (snapshot && snapshot.breakdown && snapshot.breakdown.payOnDelivery
        ? "\nPayable at delivery: " + money(snapshot.breakdown.payOnDelivery) : "") +
      (snapshot && snapshot.address
        ? "\n\nDeliver to: " + snapshot.customer.name + ", " + snapshot.address.line +
          ", " + snapshot.address.city + ", " + snapshot.address.state + " " + snapshot.address.pin : "") +
      "\n\nPlease confirm my order. Dhanyavaad! 🙏";
    return "https://wa.me/" + WA_NUMBER + "?text=" + encodeURIComponent(msg);
  }

  function renderError(title, msg) {
    root.innerHTML =
      '<div class="oc-card">' +
        '<div class="oc-icon">⚠️</div>' +
        "<h2>" + esc(title) + "</h2>" +
        '<div class="oc-error">' + esc(msg) + "</div>" +
        '<a class="btn btn-green btn-block" target="_blank" rel="noopener" href="https://wa.me/' + WA_NUMBER +
          "?text=" + encodeURIComponent("Hi WellWith! I need help with my order " + orderId) + '">💬 Ask on WhatsApp</a>' +
        '<a class="btn btn-outline btn-block" href="index.html#products">Continue Shopping</a>' +
      "</div>";
  }

  if (!orderId) {
    renderError("Order not found", "We could not find an order id in this link. If you just paid, please check your WhatsApp or contact us.");
    return;
  }

  fetch("/api/cashfree/verify?order_id=" + encodeURIComponent(orderId))
    .then(function (r) { return r.json().then(function (d) { return { status: r.status, data: d }; }); })
    .then(function (resp) {
      var d = resp.data || {};
      if (resp.status !== 200) {
        renderError("Could not verify payment", d.message || "Please try again in a minute, or ask us on WhatsApp.");
        return;
      }

      var paid = d.order_status === "PAID";
      var tags = d.order_tags || {};
      var isCod = tags.payment_method === "COD_ADVANCE";
      var codRemaining = parseFloat(tags.cod_remaining || "0");

      var addrHtml = "";
      if (snapshot && snapshot.address) {
        var a = snapshot.address;
        addrHtml = '<div class="row"><span>Deliver to</span><strong style="text-align:right;max-width:60%">' +
          esc(snapshot.customer.name) + "<br>" + esc(a.line) + "<br>" +
          esc(a.city) + ", " + esc(a.state) + " " + esc(a.pin) + "</strong></div>";
      }
      var itemsHtml = "";
      if (snapshot && snapshot.lines) {
        itemsHtml = '<div class="row"><span>Items</span><strong style="text-align:right;max-width:60%">' +
          snapshot.lines.map(function (l) { return esc(l.name) + " × " + l.qty; }).join("<br>") + "</strong></div>";
      }

      if (paid) {
        root.innerHTML =
          '<div class="oc-card">' +
            '<div class="oc-icon">✅</div>' +
            "<h2>Order confirmed!</h2>" +
            '<p style="color:var(--muted);font-size:14px">Dhanyavaad! Your payment was successful.</p>' +
            '<div class="oc-detail">' +
              '<div class="row"><span>Order ID</span><strong>' + esc(d.order_id) + "</strong></div>" +
              '<div class="row"><span>Amount paid online</span><strong>' + money(d.order_amount) + "</strong></div>" +
              itemsHtml + addrHtml +
            "</div>" +
            (isCod && codRemaining > 0
              ? '<div class="oc-cod">COD: ' + money(codRemaining) + " payable at delivery</div>"
              : "") +
            '<a class="btn btn-green btn-block" target="_blank" rel="noopener" href="' + waConfirmLink("confirmed", d.order_amount) + '">💬 Confirm on WhatsApp</a>' +
            '<a class="btn btn-outline btn-block" href="index.html#products">Continue Shopping</a>' +
          "</div>";
      } else {
        root.innerHTML =
          '<div class="oc-card">' +
            '<div class="oc-icon">⏳</div>' +
            "<h2>Payment not confirmed yet</h2>" +
            '<div class="oc-pending">Order ' + esc(d.order_id) + " — status: <strong>" + esc(d.order_status || "unknown") +
              "</strong>.<br>No money has been marked as received for this order yet.</div>" +
            '<p style="font-size:14px;color:var(--muted)">If you completed the payment, it may take a minute to reflect. ' +
              "You can also confirm directly with us on WhatsApp.</p>" +
            '<a class="btn btn-green btn-block" target="_blank" rel="noopener" href="' + waConfirmLink("payment pending", d.order_amount) + '">💬 Confirm on WhatsApp</a>' +
            '<a class="btn btn-outline btn-block" href="index.html#products">Continue Shopping</a>' +
          "</div>";
      }
    })
    .catch(function () {
      renderError("Could not verify payment", "Network error. Please check your connection and refresh, or ask us on WhatsApp.");
    });
})();
</script>
</body>
</html>
