<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Product | WellWith Sea Buckthorn</title>
  <meta name="description" content="WellWith Sea Buckthorn products – pure Himalayan wellness from Ladakh.">
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link rel="stylesheet" href="assets/css/styles.css?v=20260929-4">
  <style>
    /* Single-screen product page: no page scroll, tabbed info */
    html, body { height: 100dvh; overflow: hidden; }
    body { display: flex; flex-direction: column; }
    .product-topbar { padding: 12px 0 4px; flex: 0 0 auto; }
    .product-topbar .back-link { font-size: 16px; font-weight: 600; }
    .product-screen { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
    .product-compact-hero { flex: 0 0 auto; display: flex; gap: 14px; align-items: center; padding: 6px 0 10px; }
    .product-compact-hero .p-img { width: 92px; height: 92px; flex: 0 0 auto; border-radius: 18px; background: #fbf7ec; border: 1px solid var(--card-border); display: grid; place-items: center; padding: 8px; }
    .product-compact-hero .p-img img { width: 100%; height: 100%; object-fit: contain; }
    .product-compact-hero .p-info { min-width: 0; flex: 1 1 auto; }
    .product-compact-hero .cat { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
    .product-compact-hero .name-row { display: flex; align-items: center; gap: 10px; margin: 2px 0; }
    .product-compact-hero h1 { font-size: 22px; margin: 0; line-height: 1.15; flex: 1 1 auto; min-width: 0; }
    .product-compact-hero .btn-add { flex: 0 0 auto; font-size: 13px; padding: 9px 14px; white-space: nowrap; }
    .product-compact-hero .tagline { font-size: 14px; font-weight: 700; color: var(--gold-light); margin: 0 0 6px; }
    .product-compact-hero .p-price-row { display: flex; align-items: center; gap: 10px; }
    .product-compact-hero .p-price { font-size: 19px; font-weight: 800; }
    .product-tabs { flex: 0 0 auto; display: flex; gap: 6px; padding: 4px 0 10px; }
    .product-tabs button { flex: 1 1 0; border: 1px solid var(--card-border); background: var(--surface); border-radius: 12px; padding: 9px 4px; font-size: 13px; font-weight: 700; color: var(--text); cursor: pointer; }
    .product-tabs button.active { background: var(--gold); color: #241a05; border-color: var(--gold); }
    .product-panels { flex: 1 1 auto; min-height: 0; position: relative; }
    .product-panel { position: absolute; inset: 0; overflow: hidden; display: none; padding-bottom: 8px; }
    .product-panel.active { display: flex; flex-direction: column; }
    .product-panel .desc { font-size: 14.5px; line-height: 1.55; color: var(--text); margin: 0 0 12px; }
    .product-panel .panel-actions { display: flex; gap: 10px; margin-top: auto; padding-top: 8px; }
    .product-panel .panel-actions .btn { flex: 1 1 0; font-size: 15px; padding: 12px 8px; }
    .ing-list { display: flex; flex-direction: column; gap: 8px; }
    .ing-row { background: var(--surface); border: 1px solid var(--card-border); border-radius: 12px; padding: 10px 12px; }
    .ing-row h4 { font-size: 14px; margin: 0 0 3px; }
    .ing-row p { font-size: 13px; margin: 0; color: var(--muted); line-height: 1.45; }
    .making-list { display: flex; flex-direction: column; gap: 8px; }
    .making-step { display: flex; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--card-border); border-radius: 12px; padding: 9px 12px; }
    .making-step .n { flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%; background: var(--gold); color: #241a05; font-weight: 800; font-size: 14px; display: grid; place-items: center; }
    .making-step .t { font-size: 13.5px; font-weight: 600; }
    .why-badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .why-badge { background: var(--surface); border: 1px solid var(--card-border); border-radius: 12px; padding: 10px 8px; text-align: center; }
    .why-badge strong { display: block; font-size: 13px; margin-bottom: 2px; }
    .why-badge span { font-size: 11.5px; color: var(--muted); }
    @media (min-width: 760px) {
      .product-compact-hero .p-img { width: 130px; height: 130px; }
      .product-compact-hero h1 { font-size: 30px; }
      .product-compact-hero .tagline { font-size: 16px; }
      .product-compact-hero .p-price { font-size: 24px; }
      .product-tabs button { font-size: 15px; padding: 12px 4px; }
      .product-panel .desc { font-size: 16px; }
      .ing-row h4 { font-size: 16px; }
      .ing-row p { font-size: 14px; }
      .making-step .t { font-size: 15px; }
    }
  </style>
</head>
<body>

<header class="product-topbar">
  <div class="container">
    <a class="back-link" href="index.html#products">← Back</a>
  </div>
</header>

<div class="container product-screen" id="product-root"></div>

<script src="assets/js/data.js?v=20260929-1"></script>
<script src="assets/js/app.js?v=20260929-4"></script>
<script>
(function () {
  var slug = new URLSearchParams(window.location.search).get("slug");
  var p = (typeof PRODUCTS !== "undefined") ? PRODUCTS.find(function (x) { return x.slug === slug; }) : null;
  var root = document.getElementById("product-root");

  if (!p) {
    document.title = "Product not found | WellWith";
    root.innerHTML = '<div class="center" style="padding:60px 0">' +
      '<h1 class="display">Product not found</h1>' +
      '<p class="section-sub"><a href="index.html#products" style="color:var(--gold)">← Go back to products</a></p></div>';
    return;
  }

  document.title = p.name + " | WellWith Sea Buckthorn";
  var cat = p.category === "concentrate" ? "Liquid Concentrate" : "Specialized Add-on";
  var price = (typeof formatPrice === "function") ? formatPrice(p.price) : ("₹" + p.price);

  root.innerHTML =
    '<div class="product-compact-hero">' +
      '<div class="p-img"><img src="' + p.image + '" alt="' + p.name + '"></div>' +
      '<div class="p-info">' +
        '<span class="cat">' + cat + '</span>' +
        '<div class="name-row"><h1>' + p.name + '</h1>' +
        '<button class="btn btn-green btn-add" data-add-cart="' + p.slug + '">Add to Cart</button></div>' +
        '<p class="tagline">' + p.tagline + '</p>' +
        '<div class="p-price-row"><span class="p-price">' + price + '</span></div>' +
      '</div>' +
    '</div>' +
    '<nav class="product-tabs" role="tablist">' +
      '<button type="button" class="active" data-tab="about" role="tab">About</button>' +
      '<button type="button" data-tab="ingredients" role="tab">Ingredients</button>' +
      '<button type="button" data-tab="making" role="tab">Making</button>' +
      '<button type="button" data-tab="why" role="tab">Why Us</button>' +
    '</nav>' +
    '<div class="product-panels">' +
      '<div class="product-panel active" data-panel="about" role="tabpanel">' +
        '<p class="desc">' + p.description + '</p>' +
      '</div>' +
      '<div class="product-panel" data-panel="ingredients" role="tabpanel">' +
        '<div class="ing-list">' +
          p.ingredientsList.map(function (ing) {
            return '<div class="ing-row"><h4>' + ing.name + '</h4><p>' + ing.benefit + '</p></div>';
          }).join("") +
        '</div>' +
      '</div>' +
      '<div class="product-panel" data-panel="making" role="tabpanel">' +
        '<div class="making-list">' +
          ["Wild Harvest — Ladakh 11,500 ft", "Handpicked Golden Berries", "Cold-Pressed Pure Pulp", "Lab Tested — 190+ Compounds", "Bottled Fresh"].map(function (s, i) {
            return '<div class="making-step"><span class="n">' + (i + 1) + '</span><span class="t">' + s + '</span></div>';
          }).join("") +
        '</div>' +
      '</div>' +
      '<div class="product-panel" data-panel="why" role="tabpanel">' +
        '<div class="why-badges">' +
          '<div class="why-badge"><strong>100% Natural</strong><span>No synthetic additives</span></div>' +
          '<div class="why-badge"><strong>Ladakh Sourced</strong><span>11,500 ft altitude</span></div>' +
          '<div class="why-badge"><strong>DRDO Trusted</strong><span>Scientific validation</span></div>' +
        '</div>' +
        '<p class="desc">' + p.description + '</p>' +
      '</div>' +
    '</div>';

  // Tab switching
  var tabs = root.querySelectorAll(".product-tabs button");
  var panels = root.querySelectorAll(".product-panel");
  tabs.forEach(function (t) {
    t.addEventListener("click", function () {
      tabs.forEach(function (x) { x.classList.remove("active"); });
      panels.forEach(function (x) { x.classList.remove("active"); });
      t.classList.add("active");
      var panel = root.querySelector('.product-panel[data-panel="' + t.getAttribute("data-tab") + '"]');
      if (panel) panel.classList.add("active");
    });
  });
})();
</script>
</body>
</html>
