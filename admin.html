<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>WellWith — Admin Orders</title>
<style>
  :root{
    --green:#1e7a3c; --green-d:#155e2d; --gold:#c9a227;
    --bg:#f4f6f4; --card:#ffffff; --ink:#1c2b21; --mut:#6b7a6f;
    --line:#e3e9e3; --amber:#b45309; --amber-bg:#fef3c7;
    --red:#b91c1c; --red-bg:#fee2e2; --blue:#1d4ed8; --blue-bg:#dbeafe;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--ink);}
  .wrap{max-width:960px; margin:0 auto; padding:16px;}
  header.top{background:linear-gradient(135deg,var(--green-d),var(--green)); color:#fff;
    padding:18px 16px; position:sticky; top:0; z-index:5;}
  header.top .wrap{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  header.top h1{font-size:18px; margin:0;}
  header.top p{margin:2px 0 0; font-size:12px; opacity:.85;}
  .btn{background:#fff; color:var(--green-d); border:0; border-radius:10px;
    padding:9px 14px; font-weight:700; font-size:13px; cursor:pointer;}
  .btn.ghost{background:transparent; color:#fff; border:1.5px solid rgba(255,255,255,.6);}
  .btn.dark{background:var(--green); color:#fff; width:100%; padding:13px; font-size:15px;
    border-radius:12px;}
  .btn:disabled{opacity:.6; cursor:wait;}
  /* login */
  .login{max-width:380px; margin:8vh auto; background:var(--card); border-radius:16px;
    padding:28px 24px; box-shadow:0 8px 30px rgba(0,0,0,.08);}
  .login h2{margin:0 0 6px; font-size:20px;}
  .login p{margin:0 0 18px; color:var(--mut); font-size:13px;}
  .login input{width:100%; padding:13px 14px; font-size:16px; border:1.5px solid var(--line);
    border-radius:12px; margin-bottom:12px;}
  .login input:focus{outline:none; border-color:var(--green);}
  .err{background:var(--red-bg); color:var(--red); border-radius:10px; padding:10px 12px;
    font-size:13px; margin-bottom:12px; display:none;}
  /* stats */
  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:16px 0;}
  .stat{background:var(--card); border-radius:14px; padding:14px 12px; text-align:center;
    box-shadow:0 2px 10px rgba(0,0,0,.05);}
  .stat b{display:block; font-size:20px;}
  .stat span{font-size:11px; color:var(--mut); text-transform:uppercase; letter-spacing:.4px;}
  /* order cards */
  .order{background:var(--card); border-radius:14px; margin-bottom:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.05); overflow:hidden;}
  .order-head{padding:14px 16px; display:flex; align-items:center; gap:10px;
    cursor:pointer; flex-wrap:wrap;}
  .order-head .id{font-weight:800; font-size:14px;}
  .order-head .meta{font-size:12px; color:var(--mut);}
  .order-head .sp{flex:1;}
  .pill{font-size:11px; font-weight:800; padding:5px 10px; border-radius:999px;
    text-transform:uppercase; letter-spacing:.4px; white-space:nowrap;}
  .pill.paid{background:#dcfce7; color:#166534;}
  .pill.pending{background:var(--amber-bg); color:var(--amber);}
  .pill.failed{background:var(--red-bg); color:var(--red);}
  .pill.active{background:var(--blue-bg); color:var(--blue);}
  .pill.prepaid{background:#e0e7ff; color:#3730a3;}
  .pill.cod{background:#fae8ff; color:#86198f;}
  .order-body{display:none; border-top:1px solid var(--line); padding:14px 16px; font-size:13px;}
  .order.open .order-body{display:block;}
  .kv{display:grid; grid-template-columns:110px 1fr; gap:6px 10px; margin-bottom:10px;}
  .kv dt{color:var(--mut);} .kv dd{margin:0; font-weight:600;}
  .kv dd.addr{font-weight:500; line-height:1.5;}
  table.items{width:100%; border-collapse:collapse; margin:6px 0 12px; font-size:13px;}
  table.items th{text-align:left; color:var(--mut); font-weight:600; font-size:11px;
    text-transform:uppercase; padding:6px 4px; border-bottom:1px solid var(--line);}
  table.items td{padding:8px 4px; border-bottom:1px solid #f0f3f0;}
  table.items td.r, table.items th.r{text-align:right;}
  .totals{margin-left:auto; max-width:280px; width:100%;}
  .totals .row{display:flex; justify-content:space-between; padding:4px 0;}
  .totals .row.grand{font-weight:800; font-size:15px; border-top:1px solid var(--line);
    margin-top:6px; padding-top:8px;}
  .totals .disc{color:var(--green);}
  .empty{background:var(--card); border-radius:14px; padding:40px 20px; text-align:center;
    color:var(--mut);}
  .toolbar{display:flex; gap:10px; align-items:center; margin:4px 0 0;}
  .toolbar .note{font-size:12px; color:var(--mut);}
  @media(max-width:560px){
    .stats{grid-template-columns:repeat(2,1fr);}
    .kv{grid-template-columns:96px 1fr;}
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div>
      <h1>🌿 WellWith Admin</h1>
      <p>Cashfree checkout orders</p>
    </div>
    <div class="toolbar" id="topActions" style="display:none">
      <button class="btn ghost" id="refreshBtn">↻ Refresh</button>
      <button class="btn" id="logoutBtn">Logout</button>
    </div>
  </div>
</header>

<div class="wrap">
  <!-- login -->
  <div class="login" id="loginBox">
    <h2>Admin login</h2>
    <p>Enter the admin password to view orders.</p>
    <div class="err" id="loginErr"></div>
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password">
    <button class="btn dark" id="loginBtn">View orders</button>
  </div>

  <!-- dashboard -->
  <div id="dash" style="display:none">
    <div class="stats">
      <div class="stat"><b id="stTotal">0</b><span>Orders</span></div>
      <div class="stat"><b id="stPaid">0</b><span>Paid</span></div>
      <div class="stat"><b id="stPending">0</b><span>Pending</span></div>
      <div class="stat"><b id="stRevenue">₹0</b><span>Collected</span></div>
    </div>
    <div class="toolbar"><span class="note" id="listNote"></span></div>
    <div id="orders"></div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var loginBox = document.getElementById("loginBox");
  var dash = document.getElementById("dash");
  var topActions = document.getElementById("topActions");
  var pwInput = document.getElementById("pw");
  var loginBtn = document.getElementById("loginBtn");
  var loginErr = document.getElementById("loginErr");
  var ordersEl = document.getElementById("orders");

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function money(n){
    n = Number(n);
    if (!isFinite(n)) return "₹0";
    return "₹" + n.toLocaleString("en-IN", {maximumFractionDigits: 2});
  }
  function dt(iso){
    if (!iso) return "—";
    var d = new Date(iso);
    if (isNaN(d)) return "—";
    return d.toLocaleString("en-IN", {day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit"});
  }
  function statusPill(s){
    s = String(s || "PENDING").toUpperCase();
    var cls = s === "PAID" ? "paid" : s === "FAILED" ? "failed" : s === "ACTIVE" ? "active" : "pending";
    return '<span class="pill ' + cls + '">' + esc(s) + "</span>";
  }

  function orderCard(o){
    var lines = Array.isArray(o.lines) ? o.lines : [];
    var itemsHtml = lines.map(function(l){
      return "<tr><td>" + esc(l.slug) + " × " + esc(l.qty) + "</td>" +
        '<td class="r">' + money(l.lineTotal) + "</td></tr>";
    }).join("");
    var a = o.address || {};
    var addr = [a.line, a.city, a.state, a.pin].filter(Boolean).join(", ");
    var c = o.customer || {};
    return '<div class="order">' +
      '<div class="order-head">' +
        '<div><div class="id">' + esc(o.orderId) + "</div>" +
        '<div class="meta">' + dt(o.createdAt) + " · " + esc(c.name || "") + "</div></div>" +
        '<div class="sp"></div>' +
        '<span class="pill ' + (o.paymentMethod === "COD" ? "cod" : "prepaid") + '">' +
          esc(o.paymentMethod || "") + "</span>" +
        statusPill(o.status) +
        '<div style="font-weight:800">' + money(o.total) + "</div>" +
      "</div>" +
      '<div class="order-body">' +
        '<dl class="kv">' +
          "<dt>Customer</dt><dd>" + esc(c.name || "—") + "</dd>" +
          '<dt>Phone</dt><dd><a href="tel:+91' + esc(c.phone || "") + '">+91 ' + esc(c.phone || "—") + "</a></dd>" +
          '<dt>Address</dt><dd class="addr">' + esc(addr || "—") + "</dd>" +
          "<dt>Coupon</dt><dd>" + esc(o.coupon || "—") + "</dd>" +
          "<dt>Cashfree ID</dt><dd>" + esc(o.cfOrderId || "—") + "</dd>" +
          (o.paidAt ? "<dt>Paid at</dt><dd>" + dt(o.paidAt) + "</dd>" : "") +
        "</dl>" +
        '<table class="items"><thead><tr><th>Item</th><th class="r">Amount</th></tr></thead>' +
        "<tbody>" + itemsHtml + "</tbody></table>" +
        '<div class="totals">' +
          '<div class="row"><span>Subtotal</span><span>' + money(o.subtotal) + "</span></div>" +
          (o.discount > 0 ? '<div class="row disc"><span>Discount</span><span>− ' + money(o.discount) + "</span></div>" : "") +
          '<div class="row grand"><span>Total</span><span>' + money(o.total) + "</span></div>" +
          '<div class="row"><span>Paid online</span><span>' + money(o.payNow) + "</span></div>" +
          (o.payOnDelivery > 0 ? '<div class="row"><span>Collect on delivery</span><span><b>' + money(o.payOnDelivery) + "</b></span></div>" : "") +
        "</div>" +
      "</div>" +
    "</div>";
  }

  function render(orders){
    var paid = 0, pending = 0, revenue = 0;
    orders.forEach(function(o){
      var s = String(o.status || "").toUpperCase();
      if (s === "PAID") { paid++; revenue += Number(o.payNow) || 0; }
      else pending++;
    });
    document.getElementById("stTotal").textContent = orders.length;
    document.getElementById("stPaid").textContent = paid;
    document.getElementById("stPending").textContent = pending;
    document.getElementById("stRevenue").textContent = money(revenue);
    document.getElementById("listNote").textContent =
      orders.length ? "Newest first · tap an order for details" : "";
    ordersEl.innerHTML = orders.length
      ? orders.map(orderCard).join("")
      : '<div class="empty">No orders yet. They will appear here after the first checkout.</div>';
    ordersEl.querySelectorAll(".order-head").forEach(function(h){
      h.addEventListener("click", function(){ h.parentElement.classList.toggle("open"); });
    });
  }

  function showErr(msg){
    loginErr.textContent = msg;
    loginErr.style.display = "block";
  }

  function load(pw){
    loginBtn.disabled = true;
    loginBtn.textContent = "Loading…";
    return fetch("/api/admin/orders", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({password: pw})
    }).then(function(r){ return r.json().then(function(j){ return {ok: r.ok, j: j}; }); })
    .then(function(res){
      loginBtn.disabled = false;
      loginBtn.textContent = "View orders";
      if (!res.ok) throw new Error((res.j && res.j.message) || "Could not load orders.");
      sessionStorage.setItem("ww_admin_pw", pw);
      loginBox.style.display = "none";
      dash.style.display = "block";
      topActions.style.display = "flex";
      render(res.j.orders || []);
      return true;
    });
  }

  function doLogin(){
    loginErr.style.display = "none";
    var pw = pwInput.value;
    if (!pw) { showErr("Please enter the password."); return; }
    load(pw).catch(function(e){ showErr(e.message); });
  }

  loginBtn.addEventListener("click", doLogin);
  pwInput.addEventListener("keydown", function(e){ if (e.key === "Enter") doLogin(); });
  document.getElementById("refreshBtn").addEventListener("click", function(){
    var pw = sessionStorage.getItem("ww_admin_pw") || "";
    load(pw).catch(function(e){ showErr(e.message); loginBox.style.display = "block"; dash.style.display = "none"; });
  });
  document.getElementById("logoutBtn").addEventListener("click", function(){
    sessionStorage.removeItem("ww_admin_pw");
    pwInput.value = "";
    location.reload();
  });

  // auto-login if the tab already has the password
  var saved = sessionStorage.getItem("ww_admin_pw");
  if (saved) {
    load(saved).catch(function(){ sessionStorage.removeItem("ww_admin_pw"); });
  }
})();
</script>
</body>
</html>
